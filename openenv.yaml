spec_version: "1.0"
id: adaptive-cyber-defense
name: adaptive-cyber-defense
version: "2.0.0"
description: "Autonomous SOC assistant defending a 5-node corporate network against multi-stage cyber attacks under partial observability"
author: "shanmukhgara"
tags:
  - cybersecurity
  - reinforcement-learning
  - multi-agent
  - openenv
  - mitre-attack

api:
  reset: POST /reset  # returns observation + session_id + task + attacker_strategy
  step:  POST /step
  state: GET  /state  # returns observation + episode_info with grader_breakdown

tasks:
  - id: easy
    name: Easy Defense
    description: "Three simultaneous attacks on workstations. High detection probability, generous resources, slow progression. Goal: contain all threats before lateral spread."
    difficulty: easy
    passing_score: 0.40
    max_steps: 30
  - id: medium
    name: Medium Defense
    description: "Two simultaneous intrusions with limited SOC resources. Moderate detection, false-positive noise. Requires threat prioritisation."
    difficulty: medium
    passing_score: 0.55
    max_steps: 50
  - id: hard
    name: Hard Defense
    description: "Handle multi-stage attacks across all 5 nodes simultaneously with limited scan budget"
    difficulty: hard
    passing_score: 0.70
    max_steps: 30
  - id: nightmare
    name: Nightmare Defense
    description: "Nation-state APT. All 5 nodes under simultaneous attack. Near-zero detection, maximum evasion, fastest kill chain. Designed to genuinely challenge frontier LLMs."
    difficulty: nightmare
    passing_score: 0.80
    max_steps: 15
  - id: elite
    name: Elite Defense
    description: "Nation-state persistent threat with insider access. All nodes pre-compromised. Near-zero detection. Kill chain advances every step."
    difficulty: elite
    passing_score: 0.88
    max_steps: 15

observation:
  type: dict
  description: >
    Partially observable environment. Threats are hidden on network nodes and must be
    discovered via SCAN actions or by waiting for natural aging or stage escalation.
    The agent NEVER sees the internal threat type or MITRE technique ID directly.
    Each visible threat exposes behavioral IOC signals. Agents must reason about
    the combination of signals to infer attack class and select the correct
    mitigation. No ground-truth labels or fixed thresholds are provided. The
    environment rewards correct classification from behavioral evidence.
    False positives appear as real alerts with weaker, ambiguous IOC signals.
    Lateral spread: when a threat escalates to lateral_movement, it may spawn a
    child threat on an adjacent node. The parent's affected_node_count increments.
  fields:
    - name: visible_threats
      type: list
      description: >
        Threats currently visible to the agent. Each entry contains ONLY behavioral
        IOC signals — threat classification labels and MITRE technique names
        are intentionally withheld. The agent must classify and respond based on:
        id (opaque), node, stage (initial|lateral_movement), age (steps visible),
        escalated (bool), severity (0.0–1.0), detection_confidence (0.0–1.0),
        is_persistent (bool), spread_rate (0.0–1.0), affected_node_count (int),
        packets_per_second (int), failed_auth_attempts (int),
        outbound_data_bytes (int), lateral_connection_count (int),
        unusual_process_count (int).
    - name: hidden_threat_count
      type: int
      description: "Number of threats not yet visible to the agent (hidden on unscanned nodes)"
    - name: scan_coverage
      type: float
      description: "Fraction of nodes that have been scanned (0.0 = none, 1.0 = all)"
    - name: system_health
      type: int
      description: "Current system health (0–100). Drops on wrong actions, ignore, or uncontained threats"
    - name: score
      type: float
      description: "Running reward mean this episode (per-step signal)"
    - name: grader_score
      type: float
      description: "Authoritative episode score computed by the grader. Range 0.0–1.0. Higher is better."
    - name: step
      type: int
      description: "Current time step within the episode"
    - name: done
      type: bool
      description: "True when the episode is over (health <= 0 or max steps reached)"
    - name: episode_info
      type: dict
      description: "Grader metrics including containment_rate, critical_health, resources_remaining, speed_bonus, containment_events, false_positives_seen, false_positives_acted_on, unconfirmed_visible_count, and grader_breakdown (containment/health/resource/speed/fp_penalty components of the grader score)."

action:
  type: discrete
  description: >
    19 discrete actions. Defense actions only work against visible threats.
    Use SCAN actions to reveal hidden threats before applying mitigations.
    The correct mitigation must be inferred from behavioral
    IOC patterns in the observation. No ground-truth labels
    are provided. Agents that reason about packet rates,
    auth failures, lateral connections, and outbound bytes
    will consistently outperform agents that guess.
    VERIFY actions confirm a threat before acting (optional — earns +0.15 reward signal).
    MONITOR actions reduce resurface risk on contained persistent threats (+0.10 reward signal).
    WARNING: Some visible threats may be false positives injected by the environment.
    False positive threats appear identical to real threats. Acting on a false positive
    removes it from view but yields no containment credit and counts against resources.
  actions:
    - name: block_ip
      description: "Neutralises phishing (T1566) and lateral movement (T1021) threats"
    - name: isolate_machine
      description: "Neutralises malware (T1204) and ransomware (T1486) threats"
    - name: patch
      description: "Neutralises DDoS (T1499) threats. Takes 2 steps to complete — threat remains active during deployment."
    - name: ignore
      description: "No mitigation applied. When a visible threat is active: health -10, reward penalty. When no threats are visible: neutral (no penalty — correct no-op)."
    - name: scan_node_1
      description: "Scan node_1 to reveal hidden threats. Reward: +0.25 if real threat found, -0.05 if FP, -0.10 if clean, -0.20 if already contained, -0.30 if budget exhausted."
    - name: scan_node_2
      description: "Scan node_2 to reveal hidden threats"
    - name: scan_node_3
      description: "Scan node_3 to reveal hidden threats"
    - name: scan_node_4
      description: "Scan node_4 to reveal hidden threats"
    - name: scan_node_5
      description: "Scan node_5 to reveal hidden threats"
    - name: verify_node_1
      description: "Verify visible threats on node_1 before mitigating. Reward: +0.15 if unverified threat confirmed, -0.08 if nothing to verify (wasted step)."
    - name: verify_node_2
      description: "Verify visible threats on node_2 before mitigating"
    - name: verify_node_3
      description: "Verify visible threats on node_3 before mitigating"
    - name: verify_node_4
      description: "Verify visible threats on node_4 before mitigating"
    - name: verify_node_5
      description: "Verify visible threats on node_5 before mitigating"
    - name: monitor_node_1
      description: "Monitor node_1 post-containment to reduce resurface risk on persistent threats. Reward: +0.10 if resurface risk reduced, -0.08 if nothing to monitor."
    - name: monitor_node_2
      description: "Monitor node_2 post-containment to reduce resurface risk"
    - name: monitor_node_3
      description: "Monitor node_3 post-containment to reduce resurface risk"
    - name: monitor_node_4
      description: "Monitor node_4 post-containment to reduce resurface risk"
    - name: monitor_node_5
      description: "Monitor node_5 post-containment to reduce resurface risk"

action_space:
  type: discrete
  actions:
    - block_ip
    - isolate_machine
    - patch
    - ignore
    - scan_node_1
    - scan_node_2
    - scan_node_3
    - scan_node_4
    - scan_node_5
    - verify_node_1
    - verify_node_2
    - verify_node_3
    - verify_node_4
    - verify_node_5
    - monitor_node_1
    - monitor_node_2
    - monitor_node_3
    - monitor_node_4
    - monitor_node_5

reward:
  range: [0.0, 1.0]
  description: >
    Step rewards are normalized to [0.0, 1.0]. Final evaluation uses grader_score,
    which aggregates containment_rate (50%), critical_health (20%),
    resource_efficiency (15%), and speed_bonus (15%) minus fp_penalty (up to 10%).
    Internal reward shaping uses delta-alignment: reward = shaping_reward + 0.30 × Δgrader_estimate.
    Mitigation rewards are normalized via (raw + 2.0) / 4.0 → [0.0, 1.0]:
      Correct + instant containment:  raw 1.0 → 0.750 (age < 3 early bonus: raw 1.1 → 0.775).
      Correct + patch queued:         raw 0.80 → 0.700 (patch takes 2 steps to resolve).
      Wrong mitigation:               raw -0.50 → 0.375.
      Ignore with visible threat:                raw -1.50 → 0.125 (+ health -10).
      Ignore with no visible threats:            neutral (correct no-op, no penalty).
    Scan rewards are direct values (not normalized) to penalise wasted scans:
      Scan reveals real threat         → +0.25
      Scan reveals false positive      → -0.05
      Scan clean node (nothing found)  → -0.10
      Scan already-contained node      → -0.20
      Scan while resources exhausted   → -0.30
    Verify rewards reward disciplined confirmation before acting:
      Unverified threat confirmed      → +0.15
      Nothing new to verify            → -0.08  (wasted step)
    Monitor rewards post-containment vigilance on persistent threats:
      Resurface risk reduced           → +0.10
      Nothing resurfaceable on node    → -0.08  (wasted step)
    Agents must reason from behavioral IOCs to decide which action to apply.
    The environment never exposes threat type — classification is always inferred.

termination:
  conditions:
    - system_health <= 0
    - step >= max_steps  # per-task: easy=30, medium=50, hard=30, nightmare=15, elite=15

network:
  nodes: 5
  description: "5-node network (node_1 through node_5) with a hub-and-leaf topology. node_2 is the primary hub (connects node_1, node_3, node_5). node_5 is the secondary hub (connects node_2, node_4). Threats spawn and spread along these edges."
  topology: "node_1 -- node_2 -- node_3 -- node_4 -- node_5; node_2 also connects to node_5"
  assets:
    - id: node_1
      type: edge_workstation
      criticality: 0.40
      description: "Leaf node — low-value ingress point"
    - id: node_2
      type: primary_hub
      criticality: 0.90
      description: "Primary hub — connects node_1, node_3, node_5; highest-value target"
    - id: node_3
      type: application_server
      criticality: 0.60
      description: "Mid-chain application server"
    - id: node_4
      type: endpoint
      criticality: 0.50
      description: "Secondary endpoint"
    - id: node_5
      type: secondary_hub
      criticality: 0.80
      description: "Secondary hub — connects node_2, node_4; alternate high-value target"

mitre_attack:
  version: "14.0"
  techniques:
    - id: T1566
      name: Phishing
      tactic: Initial Access
      mitigation: block_ip
    - id: T1204
      name: User Execution (Malware)
      tactic: Execution
      mitigation: isolate_machine
    - id: T1499
      name: Endpoint Denial of Service
      tactic: Impact
      mitigation: patch
    - id: T1486
      name: Data Encrypted for Impact (Ransomware)
      tactic: Impact
      mitigation: isolate_machine
    - id: T1021
      name: Remote Services (Lateral Movement)
      tactic: Lateral Movement
      mitigation: block_ip

docker:
  port: 7860
  health_check: "/_stcore/health"
  entrypoint: "uvicorn app:app --host 0.0.0.0 --port 7860"
