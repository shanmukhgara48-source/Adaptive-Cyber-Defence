[project]
name = "adaptive-cyber-defense"
version = "0.1.0"
description = "AI Cyber Defense OpenEnv Environment"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "openenv-core>=0.2.0"
]

[project.scripts]
server = "server.app:main"

[tool.openenv]
entrypoint = "server.app:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Do not recurse into the installed venv copy of the package
norecursedirs = ["venv", ".venv", "build", "dist", "*.egg-info"]
